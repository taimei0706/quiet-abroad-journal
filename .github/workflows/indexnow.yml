name: IndexNow Ping

on:
  push:
    branches:
      - main
  schedule:
    # 毎週日曜日に自動で検索エンジンへ通知
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs
        env:
          NEXT_PUBLIC_SITE_URL: https://quiet-abroad-journal.vercel.app
